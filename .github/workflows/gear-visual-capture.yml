name: Gear visual structure capture
on:
  workflow_dispatch:
  push:
    branches: [fix/gear-visual-structure-20261017]
    paths:
      - 'tools/gear-visual-capture.cjs'
      - 'tests/gear-visual-layout.spec.cjs'
      - '.github/workflows/gear-visual-capture.yml'
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/gear-visual-layout.spec.cjs --config=playwright.config.cjs
      - run: node tools/gear-visual-capture.cjs

      - name: Archive rendered screenshots in visual QA branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa/screenshots/gear/
          git diff --cached --quiet || git commit -m 'Archive real Gear page desktop/mobile visual QA screenshots'
          git fetch origin fix/gear-visual-structure-20261017
          git rebase origin/fix/gear-visual-structure-20261017
          git push origin HEAD:fix/gear-visual-structure-20261017
